[package]
name = "autolayer-x402-upto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
# soroban-env-host 22 accepts >=2; pin v2 because v3's rand_core is incompatible
# with the host's rand_chacha 0.3 test utility.
ed25519-dalek = "=2.2.0"

[profile.release]
overflow-checks = true
lto = true
opt-level = "z"
strip = "symbols"
