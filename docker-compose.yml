services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autolayer
      POSTGRES_PASSWORD: autolayer
      POSTGRES_DB: autolayer
    ports:
      - "5434:5432"
    volumes:
      - autolayer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolayer -d autolayer"]
      interval: 5s
      timeout: 5s
      retries: 20

  autolayer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://autolayer:autolayer@postgres:5432/autolayer
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - autolayer

volumes:
  autolayer_pg:
