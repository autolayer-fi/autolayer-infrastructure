name: x402 conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test
      - run: pnpm -r run build
      - run: pnpm license:check
      - name: Test Stellar upto contract
        run: cargo test --manifest-path contracts/upto-settlement/Cargo.toml
